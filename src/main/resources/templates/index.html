<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Alumnos</title>
    <link rel="stylesheet" 
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="container my-4">

    <!-- Barra superior con usuario y cerrar sesión -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Lista de Alumnos</h1>
        <div>
            <span class="mr-3">Bienvenido, 
                <strong sec:authentication="name"></strong>
            </span>
            <form th:action="@{/logout}" method="POST" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm">
                    Cerrar Sesión
                </button>
            </form>
        </div>
    </div>

    <a th:href="@{/nuevoAlumno}" class="btn btn-primary btn-sm mb-3">+ Agregar Alumno</a>

    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Núm. Control</th>
                <th>Nombre</th>
                <th>Primer Apellido</th>
                <th>Segundo Apellido</th>
                <th>Fecha Nac.</th>
                <th>Semestre</th>
                <th>Carrera</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="alumno : ${alumnos}">
                <td th:text="${alumno.numControl}"></td>
                <td th:text="${alumno.nombre}"></td>
                <td th:text="${alumno.primerAp}"></td>
                <td th:text="${alumno.segundoAp}"></td>
                <td th:text="${alumno.fechaNac}"></td>
                <td th:text="${alumno.semestre}"></td>
                <td th:text="${alumno.carrera}"></td>
                <td>
                    <a th:href="@{/editarAlumno/{id}(id=${alumno.id})}" 
                       class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/eliminarAlumno/{id}(id=${alumno.id})}" 
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Eliminar alumno?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>

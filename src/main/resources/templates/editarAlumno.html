<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Alumno</title>
    <link rel="stylesheet" 
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="container my-4">
    <h1>Editar Alumno</h1>
    <hr>

    <form th:action="@{/guardarAlumno}" th:object="${alumno}" method="POST">
        <!-- Campo oculto para que Hibernate sepa que es un UPDATE y no un INSERT -->
        <input type="hidden" th:field="*{id}">

        <div class="form-group col-4">
            <label>Número de Control</label>
            <input type="text" th:field="*{numControl}" class="form-control">
        </div>
        <div class="form-group col-4">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control">
        </div>
        <div class="form-group col-4">
            <label>Primer Apellido</label>
            <input type="text" th:field="*{primerAp}" class="form-control">
        </div>
        <div class="form-group col-4">
            <label>Segundo Apellido</label>
            <input type="text" th:field="*{segundoAp}" class="form-control">
        </div>
        <div class="form-group col-4">
            <label>Fecha de Nacimiento</label>
            <input type="date" th:field="*{fechaNac}" class="form-control">
        </div>
        <div class="form-group col-4">
            <label>Semestre</label>
            <input type="number" th:field="*{semestre}" class="form-control" min="1" max="12">
        </div>
        <div class="form-group col-4">
            <label>Carrera</label>
            <input type="text" th:field="*{carrera}" class="form-control">
        </div>

        <button type="submit" class="btn btn-warning mt-2">Actualizar</button>
        <a th:href="@{/}" class="btn btn-secondary mt-2">Cancelar</a>
    </form>
</div>
</body>
</html>
